<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#141a2b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff762e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Subtle Grid -->
  <rect x="44" y="42" width="712" height="416" rx="22" fill="#111827" stroke="#243047" stroke-width="2"/>
  <!-- Header -->
  <circle cx="80" cy="78" r="7" fill="#ef4444"/>
  <circle cx="104" cy="78" r="7" fill="#f59e0b"/>
  <circle cx="128" cy="78" r="7" fill="#22c55e"/>
  <text x="160" y="84" fill="#9ca3af" font-family="Arial, sans-serif" font-size="16" font-weight="700">CORE WEB VITALS • PERFORMANCE AUDIT</text>
  <rect x="610" y="62" width="116" height="32" rx="16" fill="#14532d"/>
  <text x="668" y="83" text-anchor="middle" fill="#4ade80" font-family="Arial, sans-serif" font-size="13" font-weight="700">PASSED 96%</text>

  <!-- Score Gauge -->
  <circle cx="205" cy="260" r="92" fill="none" stroke="#1f2937" stroke-width="18"/>
  <circle cx="205" cy="260" r="92" fill="none" stroke="url(#ring)" stroke-width="18" stroke-dasharray="555" stroke-dashoffset="28" stroke-linecap="round" transform="rotate(-90 205 260)"/>
  <text x="205" y="268" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="56" font-weight="800">96</text>
  <text x="205" y="298" text-anchor="middle" fill="#4ade80" font-family="Arial, sans-serif" font-size="14" font-weight="700">MOBILE &amp; DESKTOP</text>

  <!-- Metrics Bars -->
  <text x="360" y="168" fill="#d1d5db" font-family="Arial, sans-serif" font-size="15" font-weight="700">First Contentful Paint (FCP)</text>
  <text x="716" y="168" text-anchor="end" fill="#4ade80" font-family="Arial, sans-serif" font-size="15" font-weight="700">0.8s</text>
  <rect x="360" y="180" width="356" height="12" rx="6" fill="#1f2937"/>
  <rect x="360" y="180" width="328" height="12" rx="6" fill="url(#bar)"/>

  <text x="360" y="232" fill="#d1d5db" font-family="Arial, sans-serif" font-size="15" font-weight="700">Largest Contentful Paint (LCP)</text>
  <text x="716" y="232" text-anchor="end" fill="#4ade80" font-family="Arial, sans-serif" font-size="15" font-weight="700">1.2s</text>
  <rect x="360" y="244" width="356" height="12" rx="6" fill="#1f2937"/>
  <rect x="360" y="244" width="314" height="12" rx="6" fill="url(#bar)"/>

  <text x="360" y="296" fill="#d1d5db" font-family="Arial, sans-serif" font-size="15" font-weight="700">Total Blocking Time (TBT)</text>
  <text x="716" y="296" text-anchor="end" fill="#4ade80" font-family="Arial, sans-serif" font-size="15" font-weight="700">40ms</text>
  <rect x="360" y="308" width="356" height="12" rx="6" fill="#1f2937"/>
  <rect x="360" y="308" width="336" height="12" rx="6" fill="url(#bar)"/>

  <text x="360" y="360" fill="#d1d5db" font-family="Arial, sans-serif" font-size="15" font-weight="700">Cumulative Layout Shift (CLS)</text>
  <text x="716" y="360" text-anchor="end" fill="#4ade80" font-family="Arial, sans-serif" font-size="15" font-weight="700">0.00</text>
  <rect x="360" y="372" width="356" height="12" rx="6" fill="#1f2937"/>
  <rect x="360" y="372" width="356" height="12" rx="6" fill="url(#bar)"/>
</svg>
